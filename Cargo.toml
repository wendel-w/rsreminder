[package]
name = "rsreminder"
version = "0.1.0"
edition = "2024"
description = "A small cli app that displays quotes/bible verses"
# license = "MIT" # or "MIT OR Apache-2.0", or use license-file = "LICENSE"
repository = "https://github.com/wendel-w/rsreminder"
readme = "README.md"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
colored = "3.1.1"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
terminal_size = "0.4.4"
textwrap = "0.16.4"
toml = "1.2.2"
