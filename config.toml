[config]
# To set color, you can use rgb(in the form of an array) or hex
# Examples:
# color = [255, 0, 255]
# color = [230, 230, 230]
color = "#30a04f"

# Options for alignment: "left", "midleft", "center", "midright", "right"
# "midleft" and "midright" put the verse to the 1/3 and 2/3 of the screen      ***ENGLISH IS NOT ENGLISHING***
# Default value is "center", if not specified
# If a typo accures here rsreminder will throw an error, working on it!
align = "center"

# Default value is 50
# Negative values will throw error, working on it!
text_width = 50

# Specifying a location field is not obligatory
# Example verses:
[[passage]]
verse = "For god so loved the world, that he gave his only begotten son, that whosoever believeth in him should not perish, but have everlasting life."
[[passage]]
verse = "For god so loved the world, that he gave his only begotten son, that whosoever believeth in him should not perish, but have everlasting life."
location = "John 3:16"
